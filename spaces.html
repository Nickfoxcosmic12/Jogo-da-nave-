<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Neon Vanguard</title>
  <style>
    :root {
      --bg-1: #101b2d;
      --bg-2: #050910;
      --panel: rgba(7, 15, 26, 0.9);
      --panel-border: rgba(120, 216, 255, 0.35);
      --cyan: #62eaff;
      --cyan-soft: rgba(98, 234, 255, 0.18);
      --mint: #73ffc2;
      --gold: #ffd166;
      --pink: #ff7189;
      --danger: #ff315e;
      --violet: #c7a8ff;
      --text: #edfafe;
      --muted: #b6cad7;
      --glass: rgba(255,255,255,0.04);
      --shadow: rgba(0,0,0,0.5);
      --transition: 260ms ease;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at center, var(--bg-1), var(--bg-2) 70%);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 12px;
    }

    .game {
      position: relative;
      width: min(960px, 100%);
      aspect-ratio: 8 / 5;
      overflow: hidden;
      border: 1px solid rgba(120, 216, 255, 0.28);
      border-radius: 18px;
      background: #070d18;
      box-shadow: 0 25px 80px rgba(0,0,0,0.55);
    }

    #canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
      touch-action: none;
      user-select: none;
      background: radial-gradient(circle at center, #12233d 0%, #071018 55%, #03070d 100%);
    }

    .icon-button {
      position: absolute;
      z-index: 14;
      top: 12px;
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,0.27);
      border-radius: 10px;
      background: rgba(7,16,29,0.72);
      color: var(--text);
      font-size: 18px;
      cursor: pointer;
      pointer-events: auto;
      transition: transform var(--transition), border-color var(--transition), background var(--transition);
    }

    .icon-button:hover {
      transform: translateY(-1px);
      border-color: rgba(98, 234, 255, 0.8);
      background: rgba(12, 25, 37, 0.82);
    }

    #fullscreenButton {
      right: 12px;
    }

    #settingsButton {
      right: 56px;
    }

    .settings-panel {
      position: absolute;
      z-index: 16;
      right: 12px;
      top: 56px;
      width: 200px;
      padding: 12px 14px;
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      background: rgba(7, 16, 24, 0.9);
      box-shadow: 0 18px 40px rgba(0,0,0,0.4);
      pointer-events: auto;
    }

    .settings-panel.hidden,
    .modal.hidden,
    .overlay.hidden,
    .subscreen.hidden,
    .transition-overlay.hidden {
      display: none !important;
    }

    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .switch {
      position: relative;
      width: 38px;
      height: 22px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.18);
      cursor: pointer;
      transition: background var(--transition);
    }

    .switch::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: white;
      transition: transform var(--transition), background var(--transition);
    }

    .switch.on {
      background: rgba(115, 255, 194, 0.25);
      border-color: rgba(115, 255, 194, 0.6);
    }

    .switch.on::after {
      transform: translateX(16px);
      background: var(--mint);
    }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(2, 7, 15, 0.6);
      backdrop-filter: blur(7px);
      transition: opacity var(--transition), visibility var(--transition);
    }

    .menu-panel {
      width: min(760px, 100%);
      padding: 28px 22px 20px;
      border: 1px solid var(--panel-border);
      border-radius: 20px;
      background: linear-gradient(180deg, rgba(9, 17, 29, 0.86), rgba(6, 12, 20, 0.94));
      box-shadow: 0 24px 70px rgba(0,0,0,0.4);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .menu-panel::before,
    .menu-panel::after {
      content: "";
      position: absolute;
      width: 360px;
      height: 360px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(98, 234, 255, 0.12), rgba(98, 234, 255, 0));
      top: -140px;
      left: -120px;
      pointer-events: none;
    }

    .menu-panel::after {
      right: -120px;
      left: auto;
      top: auto;
      bottom: -150px;
    }

    .brand {
      position: relative;
      display: grid;
      place-items: center;
      gap: 10px;
      margin-bottom: 28px;
      z-index: 1;
    }

    .title-line {
      width: min(240px, 50%);
      height: 2px;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, var(--cyan), transparent);
      box-shadow: 0 0 12px rgba(98, 234, 255, 0.7);
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(28px, 5vw, 64px);
      line-height: 1;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #86e6ff;
      text-shadow: 0 0 12px rgba(98, 234, 255, 0.7), 0 0 24px rgba(98, 234, 255, 0.5);
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(160px, 1fr));
      gap: 14px;
      z-index: 1;
      position: relative;
    }

    .menu-button,
    .action-button,
    .small-button,
    .subtab-button {
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(98, 234, 255, 0.16), rgba(115, 255, 194, 0.08));
      color: var(--text);
      font: inherit;
      font-weight: 800;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition), filter var(--transition);
    }

    .menu-button {
      padding: 20px 18px;
      min-height: 90px;
      font-size: clamp(14px, 2vw, 22px);
      text-transform: uppercase;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
    }

    .menu-button:hover,
    .action-button:hover,
    .small-button:hover,
    .subtab-button:hover {
      transform: translateY(-1px);
      border-color: rgba(98, 234, 255, 0.7);
      box-shadow: 0 8px 18px rgba(98, 234, 255, 0.12);
      filter: brightness(1.06);
    }

    .menu-button.primary {
      background: linear-gradient(135deg, rgba(98, 234, 255, 0.85), rgba(115, 255, 194, 0.8));
      color: #06141d;
      border-color: rgba(255,255,255,0.2);
      box-shadow: 0 12px 28px rgba(98, 234, 255, 0.26);
    }

    .subscreen {
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid rgba(255,255,255,0.08);
      position: relative;
      z-index: 1;
    }

    .subtabs {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .subtab-button {
      padding: 9px 14px;
      font-size: 11px;
      background: rgba(255,255,255,0.04);
      color: var(--muted);
    }

    .subtab-button.active {
      background: linear-gradient(135deg, rgba(98, 234, 255, 0.8), rgba(115, 255, 194, 0.8));
      color: #05151c;
      border-color: rgba(255,255,255,0.2);
    }

    .panel-card {
      display: none;
      padding: 10px 4px 0;
    }

    .panel-card.active {
      display: block;
    }

    .shop-grid,
    .ship-grid,
    .extra-grid,
    .mission-grid,
    .achievement-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(150px, 1fr));
      gap: 10px;
    }

    .shop-card,
    .ship-card,
    .extra-card,
    .mission-card,
    .achievement-card {
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 14px;
      background: rgba(255,255,255,0.03);
      padding: 12px 10px;
      text-align: left;
    }

    .shop-card h3,
    .ship-card h3,
    .extra-card h3,
    .mission-card h3,
    .achievement-card h3 {
      margin: 0 0 6px;
      font-size: 14px;
      color: var(--text);
    }

    .shop-card p,
    .ship-card p,
    .extra-card p,
    .mission-card p,
    .achievement-card p {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.45;
    }

    .level-tag,
    .chip {
      display: inline-block;
      padding: 5px 8px;
      border-radius: 999px;
      background: rgba(98, 234, 255, 0.08);
      border: 1px solid rgba(98, 234, 255, 0.28);
      color: var(--cyan);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .action-button,
    .small-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 14px;
      min-height: 42px;
      font-size: 12px;
    }

    .action-button.primary,
    .small-button.primary {
      background: linear-gradient(135deg, rgba(98, 234, 255, 0.8), rgba(115, 255, 194, 0.8));
      color: #06141d;
      border-color: rgba(255,255,255,0.15);
    }

    .action-button.danger,
    .small-button.danger {
      background: linear-gradient(135deg, rgba(255, 113, 137, 0.9), rgba(255, 173, 103, 0.9));
      color: #160d17;
    }

    .nav-row {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }

    .ship-card .ship-view {
      height: 60px;
      display: grid;
      place-items: center;
      margin-bottom: 8px;
      border-radius: 10px;
      background: rgba(255,255,255,0.02);
    }

    .ship-card svg {
      width: 58px;
      height: 42px;
      display: block;
    }

    .ship-card.selected {
      border-color: rgba(115, 255, 194, 0.5);
      box-shadow: 0 0 0 1px rgba(115,255,194,0.3), 0 0 16px rgba(115,255,194,0.1);
    }

    .ship-card button,
    .shop-card button,
    .extra-card button,
    .mission-card button,
    .achievement-card button {
      width: 100%;
      margin-top: 10px;
    }

    .stats-wrap {
      position: absolute;
      z-index: 10;
      inset: 12px 12px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    .hud-group {
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }

    .badge {
      pointer-events: auto;
      padding: 7px 10px;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      background: rgba(7, 16, 28, 0.7);
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .badge strong {
      color: var(--cyan);
      font-weight: 900;
    }

    .pause-button {
      position: absolute;
      z-index: 12;
      top: 12px;
      left: 12px;
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 10px;
      background: rgba(7,16,29,0.72);
      color: #edfafe;
      cursor: pointer;
      font-size: 15px;
      pointer-events: auto;
      box-shadow: 0 12px 26px rgba(0,0,0,0.14);
    }

    .pause-button:hover {
      border-color: rgba(98, 234, 255, 0.7);
    }

    .health-box {
      position: absolute;
      z-index: 10;
      left: 14px;
      bottom: 16px;
      width: 200px;
      height: 14px;
      padding: 2px;
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 999px;
      background: rgba(7,16,29,0.8);
      overflow: hidden;
    }

    .health-fill {
      width: 100%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #65f0a8, #73ffc2);
      transition: width 0.12s ease, background 0.12s ease;
    }

    .boss-box {
      position: absolute;
      z-index: 10;
      left: 14px;
      bottom: 42px;
      width: min(320px, 58%);
      padding: 6px 8px;
      border: 1px solid rgba(255, 113, 137, 0.5);
      border-radius: 10px;
      background: rgba(7,16,29,0.74);
      display: none;
    }

    .boss-box.visible { display: block; }

    .boss-label {
      margin-bottom: 6px;
      color: #ff9fae;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .boss-track {
      height: 12px;
      border-radius: 999px;
      background: rgba(0,0,0,0.4);
      overflow: hidden;
    }

    .boss-fill {
      width: 100%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #ff315e, #ff8a75);
      transition: width 0.14s ease;
    }

    .modal {
      position: absolute;
      inset: 0;
      z-index: 22;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(3, 7, 15, 0.54);
      backdrop-filter: blur(6px);
    }

    .modal-panel {
      width: min(420px, 100%);
      padding: 22px 20px 18px;
      border: 1px solid rgba(98, 234, 255, 0.35);
      border-radius: 18px;
      background: rgba(7, 16, 29, 0.96);
      text-align: center;
      box-shadow: 0 22px 50px rgba(0,0,0,0.42);
    }

    .modal-panel h2 {
      margin: 0 0 12px;
      font-size: clamp(22px, 4vw, 34px);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--cyan);
      text-shadow: 0 0 14px rgba(98,234,255,0.6);
    }

    .modal-panel p {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.5;
      font-size: 14px;
    }

    .modal-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(120px, 1fr));
      gap: 10px;
    }

    .transition-overlay {
      position: absolute;
      inset: 0;
      z-index: 30;
      pointer-events: none;
      background: linear-gradient(135deg, rgba(98, 234, 255, 0.08), rgba(115, 255, 194, 0.08));
      opacity: 0;
      transition: opacity 220ms ease;
    }

    .transition-overlay.active {
      opacity: 1;
    }

    .stars {
      position: absolute;
      inset: 0;
      z-index: 0;
      background-image:
        radial-gradient(circle, rgba(255,255,255,0.8) 0 1.2px, transparent 1.3px),
        radial-gradient(circle, rgba(98,234,255,0.8) 0 1px, transparent 1.2px),
        radial-gradient(circle, rgba(115,255,194,0.7) 0 1.2px, transparent 1.3px);
      background-size: 180px 180px, 220px 220px, 260px 260px;
      background-position: 0 0, 50px 80px, 30px 120px;
      animation: drift 34s linear infinite;
      opacity: 0.8;
    }

    @keyframes drift {
      from { transform: translateY(0); }
      to { transform: translateY(18px); }
    }

    @media (max-width: 760px) {
      body { padding: 6px; }
      .game { border-radius: 12px; }
      .menu-grid { grid-template-columns: 1fr; }
      .shop-grid,
      .ship-grid,
      .extra-grid,
      .mission-grid,
      .achievement-grid { grid-template-columns: 1fr; }
      .menu-panel { padding: 20px 14px 16px; }
      .stats-wrap { inset: 8px 8px auto; }
      .badge { padding: 6px 8px; font-size: 10px; }
      .health-box { width: 160px; }
      .boss-box { width: min(250px, 65%); }
    }
  </style>
</head>
<body>
  <main class="game">
    <canvas id="canvas" width="960" height="600"></canvas>
    <div class="stars" aria-hidden="true"></div>

    <button id="pauseButton" class="pause-button" aria-label="Pausar">⏸</button>
    <button id="fullscreenButton" class="icon-button" aria-label="Tela cheia">⛶</button>
    <button id="settingsButton" class="icon-button" aria-label="Configurações">⚙</button>

    <div id="settingsPanel" class="settings-panel hidden">
      <div class="settings-row">
        <span>Áudio</span>
        <div id="audioToggle" class="switch on" aria-label="Ativar áudio"></div>
      </div>
    </div>

    <div class="stats-wrap">
      <div class="hud-group">
        <div class="badge">Pontos <strong id="score">0</strong></div>
        <div class="badge">Recorde <strong id="bestScore">0</strong></div>
        <div class="badge">Onda <strong id="wave">1</strong></div>
      </div>
      <div class="hud-group">
        <div class="badge">💰 <strong id="moneyHud">0</strong></div>
        <div class="badge">Dash <strong id="dashHud">PRONTO</strong></div>
      </div>
    </div>

    <div class="health-box"><div id="healthFill" class="health-fill"></div></div>

    <div id="bossBox" class="boss-box">
      <div class="boss-label">Boss final</div>
      <div class="boss-track"><div id="bossFill" class="boss-fill"></div></div>
    </div>

    <div id="transitionOverlay" class="transition-overlay hidden"></div>

    <div id="menuOverlay" class="overlay">
      <div class="menu-panel">
        <div class="brand">
          <span class="title-line"></span>
          <h1>Neon Vanguard</h1>
          <span class="title-line"></span>
        </div>

        <div class="menu-grid">
          <button class="menu-button primary" data-screen="play">Jogar</button>
          <button class="menu-button" data-screen="ship">Minha nave</button>
          <button class="menu-button" data-screen="more">Mais</button>
        </div>

        <div id="subscreen" class="subscreen hidden">
          <div class="subtabs">
            <button class="subtab-button active" data-subtab="shop">Loja</button>
            <button class="subtab-button" data-subtab="custom">Personalização</button>
            <button class="subtab-button" data-subtab="missions">Missões</button>
            <button class="subtab-button" data-subtab="catalog">Catálogo</button>
            <button class="subtab-button" data-subtab="achievements">Conquistas</button>
          </div>

          <div id="shopPanel" class="panel-card active">
            <div class="shop-grid" id="shopGrid"></div>
          </div>

          <div id="customPanel" class="panel-card">
            <div class="ship-grid" id="shipGrid"></div>
          </div>

          <div id="missionsPanel" class="panel-card">
            <div class="mission-grid" id="missionGrid"></div>
          </div>

          <div id="catalogPanel" class="panel-card">
            <div class="extra-grid" id="catalogGrid"></div>
          </div>

          <div id="achievementsPanel" class="panel-card">
            <div class="achievement-grid" id="achievementGrid"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="pauseModal" class="modal hidden">
      <div class="modal-panel">
        <h2>Pausado</h2>
        <p>Você quer continuar a corrida ou voltar ao menu?</p>
        <div class="modal-actions">
          <button id="resumeBtn" class="action-button primary">Continuar</button>
          <button id="quitBtn" class="action-button danger">Desistir</button>
        </div>
      </div>
    </div>

    <div id="deathModal" class="modal hidden">
      <div class="modal-panel">
        <h2>Você caiu</h2>
        <p id="deathMsg">Sua nave foi destruída. Tente novamente ou volte ao menu.</p>
        <div class="modal-actions">
          <button id="retryBtn" class="action-button primary">Tentar novamente</button>
          <button id="deathQuitBtn" class="action-button danger">Desistir</button>
        </div>
      </div>
    </div>
  </main>

  <script>
    (() => {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.getElementById('score');
      const bestScoreEl = document.getElementById('bestScore');
      const waveEl = document.getElementById('wave');
      const moneyHudEl = document.getElementById('moneyHud');
      const dashHudEl = document.getElementById('dashHud');
      const healthFill = document.getElementById('healthFill');
      const bossBox = document.getElementById('bossBox');
      const bossFill = document.getElementById('bossFill');
      const menuOverlay = document.getElementById('menuOverlay');
      const pauseModal = document.getElementById('pauseModal');
      const deathModal = document.getElementById('deathModal');
      const settingsPanel = document.getElementById('settingsPanel');
      const transitionOverlay = document.getElementById('transitionOverlay');
      const shipGrid = document.getElementById('shipGrid');
      const shopGrid = document.getElementById('shopGrid');
      const missionGrid = document.getElementById('missionGrid');
      const catalogGrid = document.getElementById('catalogGrid');
      const achievementGrid = document.getElementById('achievementGrid');

      const WORLD = { w: 2400, h: 1500 };
      const stars = Array.from({ length: 180 }, () => ({
        x: Math.random() * WORLD.w,
        y: Math.random() * WORLD.h,
        r: Math.random() * 2.4 + 0.5,
        s: Math.random() * 45 + 20
      }));

      const player = {
        x: WORLD.w / 2,
        y: WORLD.h / 2,
        vx: 0,
        vy: 0,
        radius: 14,
        angle: 0,
        cooldown: 0,
        health: 100,
        maxHealth: 100,
        invulnerable: 0,
        shield: 0,
        dashCooldown: 0,
        dashX: 1,
        dashY: 0,
        dashTime: 0,
        speedBoost: 0,
        fireRateBoost: 0,
        shotPower: 1,
        color: '#62eaff',
        explosion: 0,
        spin: 0
      };

      const save = {
        money: 0,
        speed: 0,
        fire: 0,
        health: 0,
        selectedShip: 'classic',
        shipColor: '#62eaff',
        audio: true
      };

        { id: 'dart', name: 'Dardo', cost: 120, color: '#ffad67', description: 'Velocidade alta e corpo leve.' },
        { id: 'tank', name: 'Tanque', cost: 180, color: '#ffd166', description: 'Hospedagem e resistência.' },
        { id: 'stealth', name: 'Furtiva', cost: 220, color: '#c7a8ff', description: 'Perfil angular e elegante.' },
        { id: 'royal', name: 'Real', cost: 320, color: '#ff7189', description: 'Luz intensa e estilo premium.' },
        { id: 'comet', name: 'Cometa', cost: 420, color: '#73ffc2', description: 'Casco vibrante de alta potência.' }
      ];

      const upgrades = [
        { id: 'speed', label: 'Velocidade', desc: 'Move mais rápido e desliza melhor.', cost: 40 },
        { id: 'fire', label: 'Cadência', desc: 'Atira mais rápido e com melhor fluxo.', cost: 50 },
        { id: 'health', label: 'Vida', desc: 'Aumenta o máximo de vida.', cost: 60 }
      ];

      const powerups = [
        { id: 'shield', name: 'Escudo', icon: '⬡', color: '#62eaff', description: 'Absorve o próximo dano.' },
        { id: 'medkit', name: 'Kit médico', icon: '✚', color: '#73ffc2', description: 'Recupera parte da vida.' },
        { id: 'double', name: 'Tiro duplo', icon: 'Ⅱ', color: '#b7ff7c', description: 'Dispara duas balas paralelas.' },
        { id: 'triple', name: 'Tiro triplo', icon: '✦', color: '#ffe66d', description: 'Dispara três balas em leque.' },
        { id: 'laser', name: 'Laser', icon: '╋', color: '#7cf7ff', description: 'Golpes breves de energia.' },
        { id: 'speed', name: 'Velocidade', icon: '⚡', color: '#ffd166', description: 'Boost momentâneo de locomoção.' }
      ];

      const missions = [
        { id: 'kills', title: 'Limpeza da arena', desc: 'Derrote 12 inimigos.', goal: 12, reward: 60 },
        { id: 'coins', title: 'Coleta de crédito', desc: 'Colete 18 moedas.', goal: 18, reward: 70 },
        { id: 'waves', title: 'Resistência', desc: 'Sobreviva até a onda 3.', goal: 3, reward: 90 }
      ];

        { title: 'Primeiro tiro', desc: 'Dispare 10 vezes.', goal: 10, icon: '✦' },
        { title: 'Sobrevivente', desc: 'Passe da onda 2.', goal: 2, icon: '🛡' },
        { title: 'Acumulador', desc: 'Junte 100 moedas.', goal: 100, icon: '💰' },
        { title: 'Vanguardista', desc: 'Faça 600 pontos.', goal: 600, icon: '✧' },
        { title: 'Caçador', desc: 'Derrote um boss.', goal: 1, icon: '☠' }
      ];

      const input = {
        keys: new Set(),
        mouseX: canvas.width / 2,
        mouseY: canvas.height / 2,
        pointerDown: false,
        shootHeld: false
      };

      const camera = { x: 0, y: 0 };
      const bullets = [];
      const enemies = [];
      const enemyBullets = [];
      const particles = [];
      const pickups = [];
      const cashDrops = [];

      let state = 'menu';
      let score = 0;
      let bestScore = Number(localStorage.getItem('neonBest') || 0);
      let wave = 1;
      let spawnBudget = 7;
      let spawnDelay = 0.8;
      let lastTime = 0;
      let deadTimer = 0;
      let isTransitioning = false;
      let audioEnabled = save.audio;
      let missionProgress = { kills: 0, coins: 0, waves: 1 };
      let achievementProgress = { 'Primeiro tiro': 0, 'Sobrevivente': 0, 'Acumulador': 0, 'Vanguardista': 0, 'Caçador': 0 };

      function clamp(v, min, max) { return Math.min(Math.max(v, min), max); }
      function rand(min, max) { return Math.random() * (max - min) + min; }
      function playSound(freq = 440, duration = 0.06, type = 'sine', volume = 0.02) {
        if (!audioEnabled) return;
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          const ctxAudio = new AudioCtx();
          const osc = ctxAudio.createOscillator();
          const gain = ctxAudio.createGain();
          osc.type = type;
          osc.frequency.value = freq;
          gain.gain.value = volume;
          osc.connect(gain);
          gain.connect(ctxAudio.destination);
          osc.start();
          osc.stop(ctxAudio.currentTime + duration);
          setTimeout(() => ctxAudio.close(), duration * 1000 + 80);
        } catch (error) {}
      }

      function updateHud() {
        scoreEl.textContent = Math.floor(score);
        bestScoreEl.textContent = Math.floor(bestScore);
        waveEl.textContent = String(wave);
        moneyHudEl.textContent = String(save.money);
        dashHudEl.textContent = player.dashCooldown <= 0 ? 'PRONTO' : player.dashCooldown.toFixed(1) + 's';

        const ratio = clamp(player.health / player.maxHealth, 0, 1);
        healthFill.style.width = (ratio * 100) + '%';
        healthFill.style.background = ratio <= 0.25 ? 'linear-gradient(90deg, #ff315e, #ff7c6d)' : ratio <= 0.55 ? 'linear-gradient(90deg, #ffd166, #ff9a62)' : 'linear-gradient(90deg, #65f0a8, #73ffc2)';

        const boss = enemies.find(e => e.type === 'boss');
        if (boss) {
          bossBox.classList.add('visible');
          bossFill.style.width = (clamp(boss.hp / boss.maxHp, 0, 1) * 100) + '%';
          bossBox.querySelector('.boss-label').textContent = boss.name || 'Boss final';
        } else {
          bossBox.classList.remove('visible');
        }
      }

      function updateSave() {
        localStorage.setItem('neonVanguardSave', JSON.stringify(save));
      }

      function loadSave() {
        try {
          const raw = JSON.parse(localStorage.getItem('neonVanguardSave') || '{}');
          if (raw && typeof raw === 'object') {
            save.money = Number(raw.money || 0);
            save.speed = Number(raw.speed || 0);
            save.fire = Number(raw.fire || 0);
            save.health = Number(raw.health || 0);
            save.selectedShip = raw.selectedShip || 'classic';
            save.shipColor = raw.shipColor || '#62eaff';
            save.audio = raw.audio !== false;
          }
        } catch (error) {}
      }

      function resetPlayer() {
        player.maxHealth = 100 + save.health * 12;
        player.health = player.maxHealth;
        player.x = WORLD.w / 2;
        player.y = WORLD.h / 2;
        player.vx = 0;
        player.vy = 0;
        player.cooldown = 0;
        player.dashCooldown = 0;
        player.dashTime = 0;
        player.invulnerable = 0;
        player.shield = 0;
        player.speedBoost = 0;
        player.fireRateBoost = 0;
        player.shotPower = 1;
        player.angle = 0;
        player.color = save.shipColor;
        player.explosion = 0;
      }

      function beginWave(nextWave = wave + 1) {
        wave = nextWave;
        spawnBudget = 4 + wave * 2;
        spawnDelay = Math.max(0.42, 1.05 - wave * 0.045);
        updateHud();
      }

      function startGame() {
        resetPlayer();
        bullets.length = 0;
        enemies.length = 0;
        enemyBullets.length = 0;
        particles.length = 0;
        pickups.length = 0;
        cashDrops.length = 0;
        score = 0;
        wave = 1;
        spawnBudget = 6;
        spawnDelay = 0.8;
        state = 'playing';
        bestScore = Math.max(bestScore, score);
        menuOverlay.classList.add('hidden');
        pauseModal.classList.add('hidden');
        deathModal.classList.add('hidden');
        updateHud();
      }

      function returnToMenu() {
        state = 'menu';
        menuOverlay.classList.remove('hidden');
        pauseModal.classList.add('hidden');
        deathModal.classList.add('hidden');
        updateHud();
        showTransition();
      }

      function showTransition() {
        isTransitioning = true;
        transitionOverlay.classList.remove('hidden');
        transitionOverlay.classList.add('active');
        setTimeout(() => {
          transitionOverlay.classList.remove('active');
          setTimeout(() => {
            transitionOverlay.classList.add('hidden');
            isTransitioning = false;
          }, 240);
        }, 180);
      }

      function addParticles(x, y, color, count = 12) {
        for (let i = 0; i < count; i++) {
          const angle = rand(0, Math.PI * 2);
          const speed = rand(28, 180);
          particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: rand(0.25, 0.7),
            maxLife: 0.7,
            radius: rand(1.7, 4.2),
            color
          });
        }
      }

      function spawnEnemy() {
        const side = Math.floor(Math.random() * 4);
        let x = 0, y = 0;
        if (side === 0) { x = rand(0, WORLD.w); y = -40; }
        if (side === 1) { x = WORLD.w + 40; y = rand(0, WORLD.h); }
        if (side === 2) { x = rand(0, WORLD.w); y = WORLD.h + 40; }
        if (side === 3) { x = -40; y = rand(0, WORLD.h); }

        const kindRoll = Math.random();
        let kind = 'scout';
        if (wave >= 3 && kindRoll > 0.8) kind = 'runner';
        if (wave >= 4 && kindRoll > 0.9) kind = 'brute';
        if (wave >= 5 && kindRoll > 0.92) kind = 'shooter';

        const sizeMap = {
          scout: { radius: 15, speed: 52 + wave * 4, hp: 4 + wave * 0.3, color: '#ff7189', damage: 10 },
          runner: { radius: 12, speed: 90 + wave * 5, hp: 3 + wave * 0.25, color: '#ffad67', damage: 12 },
          brute: { radius: 20, speed: 42 + wave * 2.2, hp: 7 + wave * 0.5, color: '#ffd166', damage: 14 },
          shooter: { radius: 16, speed: 52 + wave * 3, hp: 5 + wave * 0.35, color: '#c7a8ff', damage: 12 }
        };

        const stats = sizeMap[kind];
        enemies.push({
          x, y,
          radius: stats.radius,
          type: kind,
          speed: stats.speed,
          hp: stats.hp,
          maxHp: stats.hp,
          color: stats.color,
          damage: stats.damage,
          shotTimer: rand(1.2, 2.4),
          angle: 0
        });
      }

      function spawnBoss() {
        const radius = 36 + wave * 1.5;
        enemies.push({
          x: WORLD.w / 2 + rand(-120, 120),
          y: WORLD.h / 2 + rand(-80, 80),
          radius,
          type: 'boss',
          name: wave % 5 === 0 ? 'Boss final' : 'Boss',
          speed: 38 + wave * 2.2,
          hp: 60 + wave * 18,
          maxHp: 60 + wave * 18,
          color: '#ff315e',
          damage: 18 + wave * 2,
          shotTimer: 1.1,
          angle: 0
        });
      }

      function shoot() {
        if (state !== 'playing' || player.cooldown > 0) return;

        let angles = [player.angle];
        if (player.shotPower >= 2) angles = [player.angle - 0.15, player.angle + 0.15];
        if (player.shotPower >= 3) angles = [player.angle - 0.26, player.angle, player.angle + 0.26];

        for (const a of angles) {
          bullets.push({
            x: player.x + Math.cos(a) * 18,
            y: player.y + Math.sin(a) * 18,
            vx: Math.cos(a) * 620,
            vy: Math.sin(a) * 620,
            radius: 4,
            life: 1.2,
            damage: 1
          });
        }

        player.cooldown = Math.max(0.08, 0.26 - save.fire * 0.02 - (player.fireRateBoost > 0 ? 0.07 : 0));
        achievementProgress['Primeiro tiro'] = (achievementProgress['Primeiro tiro'] || 0) + 1;
        playSound(650, 0.04, 'square', 0.018);
      }

      function dash() {
        if (state !== 'playing' || player.dashCooldown > 0) return;
        let dx = 0, dy = 0;
        if (input.keys.has('w') || input.keys.has('arrowup')) dy -= 1;
        if (input.keys.has('s') || input.keys.has('arrowdown')) dy += 1;
        if (input.keys.has('a') || input.keys.has('arrowleft')) dx -= 1;
        if (input.keys.has('d') || input.keys.has('arrowright')) dx += 1;
        if (dx === 0 && dy === 0) {
          dx = Math.cos(player.angle);
          dy = Math.sin(player.angle);
        }
        const len = Math.hypot(dx, dy) || 1;
        player.dashX = dx / len;
        player.dashY = dy / len;
        player.dashTime = 0.17;
        player.dashCooldown = 1.4;
        player.invulnerable = 0.25;
        player.vx = player.dashX * 820;
        player.vy = player.dashY * 820;
        addParticles(player.x, player.y, '#62eaff', 14);
        playSound(120, 0.08, 'sawtooth', 0.02);
      }

      function hurtPlayer(amount) {
        if (state !== 'playing') return;
        if (player.shield > 0) {
          player.shield = 0;
          addParticles(player.x, player.y, '#62eaff', 18);
          playSound(280, 0.08, 'triangle', 0.024);
          return;
        }
        if (player.invulnerable > 0) return;
        player.health -= amount;
        player.invulnerable = 0.5;
        addParticles(player.x, player.y, '#ff7189', 18);
        playSound(180, 0.12, 'sawtooth', 0.03);
        if (player.health <= 0) {
          die();
        }
        updateHud();
      }

      function die() {
        state = 'dead';
        deadTimer = 0.6;
        player.explosion = 1;
        addParticles(player.x, player.y, '#ff315e', 30);
        document.getElementById('deathMsg').textContent = 'Sua nave foi destruída. Tente novamente ou volte ao menu.';
        deathModal.classList.remove('hidden');
      }

      function spawnPickup(x, y) {
        const roll = Math.random();
        let kind = 'shield';
        if (roll < 0.2) kind = 'medkit';
        else if (roll < 0.36) kind = 'double';
        else if (roll < 0.5) kind = 'triple';
        else if (roll < 0.7) kind = 'laser';
        else if (roll < 0.85) kind = 'speed';
        else kind = 'shield';
        pickups.push({ x, y, kind, spin: rand(0, Math.PI * 2), life: 14 });
      }

      function dropCash(x, y) {
        cashDrops.push({ x, y, amount: 6 + Math.floor(Math.random() * 8), xVel: rand(-35, 35), yVel: rand(-35, 35), life: 14, spin: rand(0, Math.PI * 2) });
      }

      function damageEnemy(enemyIndex, amount) {
        const enemy = enemies[enemyIndex];
        if (!enemy) return;
        enemy.hp -= amount;
        if (enemy.hp <= 0) {
          const defeated = enemies.splice(enemyIndex, 1)[0];
          addParticles(defeated.x, defeated.y, defeated.color, defeated.type === 'boss' ? 36 : 14);
          score += defeated.type === 'boss' ? 260 + wave * 40 : 18 + wave * 4;
          bestScore = Math.max(bestScore, score);
          missionProgress.kills = (missionProgress.kills || 0) + 1;
          if (defeated.type === 'boss') {
            achievementProgress['Caçador'] = (achievementProgress['Caçador'] || 0) + 1;
            score += 80;
          }
          if (Math.random() < 0.55) {
            dropCash(defeated.x, defeated.y);
          }
          if (Math.random() < 0.25 || defeated.type === 'boss') {
            spawnPickup(defeated.x, defeated.y);
          }
        }
      }

      function applyPickup(kind) {
        if (kind === 'shield') player.shield = 6;
        if (kind === 'medkit') player.health = Math.min(player.maxHealth, player.health + 24);
        if (kind === 'double') player.shotPower = 2;
        if (kind === 'triple') player.shotPower = 3;
        if (kind === 'laser') player.fireRateBoost = 5;
        if (kind === 'speed') player.speedBoost = 6;
      }

      function update(dt) {
        for (const star of stars) {
          star.y += dt * star.s;
          if (star.y > WORLD.h) {
            star.y = -10;
            star.x = Math.random() * WORLD.w;
          }
        }

        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.life -= dt;
          if (p.life <= 0) particles.splice(i, 1);
        }

        for (let i = cashDrops.length - 1; i >= 0; i--) {
          const drop = cashDrops[i];
          drop.x += drop.xVel * dt;
          drop.y += drop.yVel * dt;
          drop.xVel *= 0.985;
          drop.yVel *= 0.985;
          drop.life -= dt;
          if (Math.hypot(drop.x - player.x, drop.y - player.y) < player.radius + 12) {
            save.money += drop.amount;
            missionProgress.coins = (missionProgress.coins || 0) + drop.amount;
            achievementProgress['Acumulador'] = (achievementProgress['Acumulador'] || 0) + drop.amount;
            cashDrops.splice(i, 1);
            updateSave();
          } else if (drop.life <= 0) {
            cashDrops.splice(i, 1);
          }
        }

        for (let i = pickups.length - 1; i >= 0; i--) {
          const p = pickups[i];
          p.spin += dt * 3.5;
          p.life -= dt;
          if (Math.hypot(p.x - player.x, p.y - player.y) < player.radius + 12) {
            applyPickup(p.kind);
            pickups.splice(i, 1);
            playSound(500, 0.1, 'triangle', 0.024);
          } else if (p.life <= 0) {
            pickups.splice(i, 1);
          }
        }

        if (state === 'playing') {
          const moveX = (input.keys.has('d') || input.keys.has('arrowright') ? 1 : 0) - (input.keys.has('a') || input.keys.has('arrowleft') ? 1 : 0);
          const moveY = (input.keys.has('s') || input.keys.has('arrowdown') ? 1 : 0) - (input.keys.has('w') || input.keys.has('arrowup') ? 1 : 0);
          const norm = Math.hypot(moveX, moveY) || 1;
          const speed = 220 + save.speed * 18 + (player.speedBoost > 0 ? 90 : 0);

          if (player.dashTime > 0) {
            player.x += player.dashX * 850 * dt;
            player.y += player.dashY * 850 * dt;
            player.dashTime -= dt;
          } else {
            player.vx += (moveX / norm) * speed * 6 * dt;
            player.vy += (moveY / norm) * speed * 6 * dt;
            const drag = 0.83;
            player.vx *= drag;
            player.vy *= drag;
            player.x += player.vx * dt;
            player.y += player.vy * dt;
          }

          player.x = clamp(player.x, player.radius, WORLD.w - player.radius);
          player.y = clamp(player.y, player.radius, WORLD.h - player.radius);

          const playerX = input.mouseX - canvas.width / 2 + camera.x;
          const playerY = input.mouseY - canvas.height / 2 + camera.y;
          player.angle = Math.atan2(playerY - player.y, playerX - player.x);

          if (input.pointerDown || input.shootHeld || input.keys.has(' ')) shoot();

          player.shield = Math.max(0, player.shield - dt);
          player.cooldown = Math.max(0, player.cooldown - dt);
          player.invulnerable = Math.max(0, player.invulnerable - dt);
          player.speedBoost = Math.max(0, player.speedBoost - dt);
          player.fireRateBoost = Math.max(0, player.fireRateBoost - dt);
          player.dashCooldown = Math.max(0, player.dashCooldown - dt);

          if (player.shotPower > 1 && player.fireRateBoost <= 0) {
            player.shotPower = 1;
          }

          for (let i = bullets.length - 1; i >= 0; i--) {
            const bullet = bullets[i];
            bullet.x += bullet.vx * dt;
            bullet.y += bullet.vy * dt;
            bullet.life -= dt;
            if (bullet.life <= 0) { bullets.splice(i, 1); continue; }

            let hit = false;
            for (let j = enemies.length - 1; j >= 0; j--) {
              const enemy = enemies[j];
              if (Math.hypot(bullet.x - enemy.x, bullet.y - enemy.y) < bullet.radius + enemy.radius) {
                damageEnemy(j, bullet.damage);
                bullets.splice(i, 1);
                hit = true;
                break;
              }
            }
            if (!hit && (bullet.x < -40 || bullet.x > WORLD.w + 40 || bullet.y < -40 || bullet.y > WORLD.h + 40)) {
              bullets.splice(i, 1);
            }
          }

          for (let i = enemies.length - 1; i >= 0; i--) {
            const enemy = enemies[i];
            const dx = player.x - enemy.x;
            const dy = player.y - enemy.y;
            const dist = Math.hypot(dx, dy) || 1;
            enemy.angle = Math.atan2(dy, dx);

            if (enemy.type === 'boss') {
              enemy.x += (dx / dist) * enemy.speed * 0.55 * dt;
              enemy.y += (dy / dist) * enemy.speed * 0.55 * dt;
              enemy.shotTimer -= dt;
              if (enemy.shotTimer <= 0) {
                const spread = 6;
                for (let s = -spread; s <= spread; s += 2) {
                  const ang = enemy.angle + s * 0.08;
                  enemyBullets.push({ x: enemy.x + Math.cos(ang) * enemy.radius, y: enemy.y + Math.sin(ang) * enemy.radius, vx: Math.cos(ang) * 300, vy: Math.sin(ang) * 300, radius: 6, damage: enemy.damage, life: 2.8 });
                }
                enemy.shotTimer = 1.2;
                playSound(220, 0.08, 'sawtooth', 0.02);
              }
            } else {
              enemy.x += (dx / dist) * enemy.speed * dt;
              enemy.y += (dy / dist) * enemy.speed * dt;
              enemy.shotTimer -= dt;
              if (enemy.shotTimer <= 0 && enemy.type === 'shooter') {
                const ang = Math.atan2(player.y - enemy.y, player.x - enemy.x);
                enemyBullets.push({ x: enemy.x + Math.cos(ang) * enemy.radius, y: enemy.y + Math.sin(ang) * enemy.radius, vx: Math.cos(ang) * 260, vy: Math.sin(ang) * 260, radius: 5, damage: enemy.damage, life: 2.2 });
                enemy.shotTimer = 1.8;
              }
            }

            if (dist < player.radius + enemy.radius) {
              hurtPlayer(enemy.damage);
              enemies.splice(i, 1);
            }
          }

          for (let i = enemyBullets.length - 1; i >= 0; i--) {
            const shot = enemyBullets[i];
            shot.x += shot.vx * dt;
            shot.y += shot.vy * dt;
            shot.life -= dt;
            if (Math.hypot(shot.x - player.x, shot.y - player.y) < shot.radius + player.radius) {
              hurtPlayer(shot.damage);
              enemyBullets.splice(i, 1);
            } else if (shot.life <= 0 || shot.x < -50 || shot.x > WORLD.w + 50 || shot.y < -50 || shot.y > WORLD.h + 50) {
              enemyBullets.splice(i, 1);
            }
          }

          if (enemies.length === 0 && score >= wave * 80) {
            beginWave(wave + 1);
            if (wave % 4 === 0) spawnBoss();
          }

          if (spawnBudget > 0) {
            spawnDelay -= dt;
            if (spawnDelay <= 0) {
              spawnEnemy();
              spawnBudget -= 1;
              spawnDelay = Math.max(0.45, 1.1 - wave * 0.06);
            }
          }

          if (Math.random() < 0.005) {
            const x = rand(80, WORLD.w - 80);
            const y = rand(80, WORLD.h - 80);
            if (Math.hypot(x - player.x, y - player.y) > 120) {
              pickups.push({ x, y, kind: ['shield', 'medkit', 'double', 'laser', 'speed'][Math.floor(Math.random() * 5)], spin: rand(0, Math.PI * 2), life: 12 });
            }
          }

          if (score > bestScore) {
            bestScore = score;
            localStorage.setItem('neonBest', String(Math.floor(bestScore)));
          }
        }

        if (state === 'dead') {
          deadTimer -= dt;
          if (deadTimer <= 0) {
            player.explosion = 0;
          }
        }

        updateHud();
      }

      function drawBackground() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const grad = ctx.createRadialGradient(canvas.width / 2, canvas.height / 2, 50, canvas.width / 2, canvas.height / 2, Math.max(canvas.width, canvas.height));
        grad.addColorStop(0, '#14233f');
        grad.addColorStop(0.6, '#0a1320');
        grad.addColorStop(1, '#040910');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        for (const star of stars) {
          const x = ((star.x - camera.x) % WORLD.w + WORLD.w) % WORLD.w;
          const y = ((star.y - camera.y) % WORLD.h + WORLD.h) % WORLD.h;
          ctx.fillStyle = 'rgba(255,255,255,0.85)';
          ctx.beginPath();
          ctx.arc(x, y, star.r, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function drawPlayer() {
        const color = save.shipColor || '#62eaff';
        ctx.save();
        ctx.translate(player.x - camera.x, player.y - camera.y);
        ctx.rotate(player.angle);

        if (player.invulnerable > 0 && Math.floor(player.invulnerable * 14) % 2 === 0) {
          ctx.globalAlpha = 0.45;
        }

        if (player.shield > 0) {
          ctx.strokeStyle = '#62eaff';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.arc(0, 0, 24, 0, Math.PI * 2);
          ctx.stroke();
        }

        const flame = ctx.createLinearGradient(-12, 0, -34, 0);
        flame.addColorStop(0, 'rgba(255,255,255,0.6)');
        flame.addColorStop(0.4, color);
        flame.addColorStop(1, 'rgba(53,117,255,0)');
        ctx.fillStyle = flame;
        ctx.beginPath();
        ctx.moveTo(-18, -6);
        ctx.lineTo(-30, 0);
        ctx.lineTo(-18, 6);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = color;
        ctx.strokeStyle = '#eafaff';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(12, 0);
        ctx.lineTo(4, -7);
        ctx.lineTo(-8, -16);
        ctx.lineTo(-7, -6);
        ctx.lineTo(-17, -10);
        ctx.lineTo(-10, 0);
        ctx.lineTo(-17, 10);
        ctx.lineTo(-7, 6);
        ctx.lineTo(-8, 16);
        ctx.lineTo(4, 7);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#dffcff';
        ctx.beginPath();
        ctx.ellipse(8, 0, 4, 2.3, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawEnemy(enemy) {
        ctx.save();
        ctx.translate(enemy.x - camera.x, enemy.y - camera.y);
        ctx.rotate(enemy.angle || 0);

        if (enemy.type === 'boss') {
          ctx.fillStyle = enemy.color;
          ctx.shadowColor = enemy.color;
          ctx.shadowBlur = 18;
          ctx.beginPath();
          for (let i = 0; i < 8; i++) {
            const ang = (Math.PI * 2 / 8) * i;
            const r = i % 2 === 0 ? enemy.radius : enemy.radius * 0.55;
            const px = Math.cos(ang) * r;
            const py = Math.sin(ang) * r;
            if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
          }
          ctx.closePath();
          ctx.fill();
          ctx.shadowBlur = 0;
        } else {
          ctx.fillStyle = enemy.color;
          ctx.beginPath();
          ctx.moveTo(enemy.radius, 0);
          ctx.lineTo(enemy.radius * 0.18, -enemy.radius * 0.9);
          ctx.lineTo(-enemy.radius * 0.8, -enemy.radius * 0.75);
          ctx.lineTo(-enemy.radius * 0.28, 0);
          ctx.lineTo(-enemy.radius * 0.8, enemy.radius * 0.75);
          ctx.lineTo(enemy.radius * 0.18, enemy.radius * 0.9);
          ctx.closePath();
          ctx.fill();
        }

        ctx.restore();
      }

      function drawBullets() {
        for (const bullet of bullets) {
          ctx.fillStyle = '#dffcff';
          ctx.beginPath();
          ctx.arc(bullet.x - camera.x, bullet.y - camera.y, bullet.radius, 0, Math.PI * 2);
          ctx.fill();
        }
        for (const shot of enemyBullets) {
          ctx.fillStyle = '#ff5d7e';
          ctx.beginPath();
          ctx.arc(shot.x - camera.x, shot.y - camera.y, shot.radius, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function drawPickups() {
        for (const p of pickups) {
          const info = powerups.find(item => item.id === p.kind) || powerups[0];
          ctx.save();
          ctx.translate(p.x - camera.x, p.y - camera.y);
          ctx.rotate(p.spin);
          ctx.fillStyle = info.color;
          ctx.shadowBlur = 20;
          ctx.shadowColor = info.color;
          ctx.beginPath();
          ctx.moveTo(0, -12);
          ctx.lineTo(10, 0);
          ctx.lineTo(0, 12);
          ctx.lineTo(-10, 0);
          ctx.closePath();
          ctx.fill();
          ctx.shadowBlur = 0;
          ctx.restore();
        }
      }

      function drawCash() {
        for (const coin of cashDrops) {
          ctx.save();
          ctx.translate(coin.x - camera.x, coin.y - camera.y);
          ctx.rotate(coin.spin);
          ctx.fillStyle = '#ffd166';
          ctx.beginPath();
          ctx.arc(0, 0, 8, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#7d5200';
          ctx.font = 'bold 10px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('$', 0, 3);
          ctx.restore();
        }
      }

      function drawParticles() {
        for (const p of particles) {
          ctx.globalAlpha = clamp(p.life / p.maxLife, 0, 1);
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x - camera.x, p.y - camera.y, p.radius, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }

      function drawDeathExplosion() {
        if (state !== 'dead' || player.explosion <= 0) return;
        ctx.save();
        ctx.translate(player.x - camera.x, player.y - camera.y);
        ctx.fillStyle = 'rgba(255, 113, 137, 0.8)';
        ctx.beginPath();
        ctx.arc(0, 0, 18 + (1 - player.explosion) * 40, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function render() {
        drawBackground();
        for (const enemy of enemies) drawEnemy(enemy);
        drawBullets();
        drawPickups();
        drawCash();
        drawParticles();
        drawPlayer();
        drawDeathExplosion();
      }

      function loop(ts) {
        const dt = Math.min((ts - lastTime) / 1000 || 0.016, 0.033);
        lastTime = ts;
        update(dt);
        render();
        requestAnimationFrame(loop);
      }

      function populateShop() {
        shopGrid.innerHTML = upgrades.map(item => {
          const level = save[item.id] || 0;
          const cost = item.cost + level * 30;
          return `
            <div class="shop-card">
              <h3>${item.label}</h3>
              <p>${item.desc}</p>
              <span class="level-tag">Nível ${level}</span>
              <button class="small-button ${save.money >= cost ? 'primary' : ''}" data-upgrade="${item.id}" ${save.money < cost ? 'disabled' : ''}>${save.money >= cost ? 'Comprar' : 'Falta'} · ${cost} 💰</button>
            </div>
          `;
        }).join('');

        shopGrid.querySelectorAll('[data-upgrade]').forEach(button => {
          button.addEventListener('click', () => {
            const kind = button.dataset.upgrade;
            const cost = upgrades.find(i => i.id === kind).cost + (save[kind] || 0) * 30;
            if (save.money < cost) return;
            save.money -= cost;
            save[kind] = (save[kind] || 0) + 1;
            if (kind === 'speed') player.speedBoost = 4;
            if (kind === 'fire') player.fireRateBoost = 4;
            if (kind === 'health') player.maxHealth += 18;
            updateSave();
            populateShop();
            updateHud();
          });
        });
      }

      function renderShips() {
        const selected = save.selectedShip;
        shipGrid.innerHTML = ships.map(ship => {
          const selectedClass = ship.id === selected ? 'selected' : '';
          return `
            <div class="ship-card ${selectedClass}">
              <div class="ship-view">
                <svg viewBox="-24 -18 48 32" aria-label="${ship.name}">
                  <path d="M20 0 L5 -8 L-10 -15 L-7 -6 L-17 -10 L-12 0 L-17 10 L-7 6 L-10 15 L5 8 Z" fill="${ship.color}" stroke="#eafaff" stroke-width="1.2" stroke-linejoin="round"/>
                </svg>
              </div>
              <h3>${ship.name}</h3>
              <p>${ship.description}</p>
              <button class="small-button ${ship.id === selected ? 'primary' : ''}" data-ship="${ship.id}">${ship.id === selected ? 'Selecionada' : `Comprar · ${ship.cost} 💰`}</button>
            </div>
          `;
        }).join('');

        shipGrid.querySelectorAll('[data-ship]').forEach(button => {
          button.addEventListener('click', () => {
            const ship = ships.find(item => item.id === button.dataset.ship);
            if (!ship) return;
            if (save.selectedShip !== ship.id) {
              if (save.money < ship.cost && ship.id !== 'classic') return;
              if (ship.id !== 'classic') save.money -= ship.cost;
              save.selectedShip = ship.id;
              save.shipColor = ship.color;
              player.color = ship.color;
              updateSave();
            }
            renderShips();
            populateShop();
          });
        });
      }

      function renderMissions() {
        missionGrid.innerHTML = missions.map(item => {
          const progress = item.id === 'kills' ? missionProgress.kills : item.id === 'coins' ? missionProgress.coins : missionProgress.waves;
          const done = progress >= item.goal;
          return `
            <div class="mission-card">
              <h3>${item.title}</h3>
              <p>${item.desc}</p>
              <span class="chip">${Math.min(progress, item.goal)} / ${item.goal}</span>
              <button class="small-button ${done ? 'primary' : ''}" ${done ? '' : 'disabled'}>${done ? 'Resgatar' : 'Em progresso'}</button>
            </div>
          `;
        }).join('');
      }

      function renderCatalog() {
        catalogGrid.innerHTML = powerups.map(item => `
          <div class="extra-card">
            <h3>${item.name}</h3>
            <p>${item.description}</p>
            <span class="chip">${item.icon}</span>
          </div>
        `).join('');
      }

      function renderAchievements() {
        achievementGrid.innerHTML = achievements.map(item => {
          const key = item.title;
          const value = achievementProgress[key] || 0;
          return `
            <div class="achievement-card">
              <h3>${item.icon} ${item.title}</h3>
              <p>${item.desc}</p>
              <span class="chip">${Math.min(value, item.goal)} / ${item.goal}</span>
            </div>
          `;
        }).join('');
      }

      function openScreen(screen) {
        const subscreen = document.getElementById('subscreen');
        subscreen.classList.remove('hidden');

        const activeTab = screen === 'ship' ? 'shop' : 'missions';
        document.querySelectorAll('.subtab-button').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.subtab === activeTab);
        });
        document.querySelectorAll('.panel-card').forEach(panel => {
          panel.classList.toggle('active', panel.id === activeTab + 'Panel');
        });

        if (screen === 'ship') {
          renderShips();
          populateShop();
        }
        if (screen === 'more') {
          renderMissions();
          renderCatalog();
          renderAchievements();
        }
      }

      function showMenu() {
        menuOverlay.classList.remove('hidden');
      }

      function startscreen() {
        menuOverlay.classList.add('hidden');
        pauseModal.classList.add('hidden');
        deathModal.classList.add('hidden');
        startGame();
      }

      function showTransition() {
        transitionOverlay.classList.remove('hidden');
        transitionOverlay.classList.add('active');
        setTimeout(() => {
          transitionOverlay.classList.remove('active');
          setTimeout(() => transitionOverlay.classList.add('hidden'), 240);
        }, 180);
      }

      document.querySelectorAll('[data-screen]').forEach(button => {
        button.addEventListener('click', () => {
          const screen = button.dataset.screen;
          if (screen === 'play') {
            showTransition();
            setTimeout(() => startGame(), 120);
          } else {
            openScreen(screen);
          }
        });
      });

      document.querySelectorAll('.subtab-button').forEach(button => {
        button.addEventListener('click', () => {
          document.querySelectorAll('.subtab-button').forEach(btn => btn.classList.toggle('active', btn === button));
          const sub = button.dataset.subtab;
          document.querySelectorAll('.panel-card').forEach(panel => {
            panel.classList.toggle('active', panel.id === sub + 'Panel');
          });
          if (sub === 'custom') renderShips();
          if (sub === 'shop') populateShop();
          if (sub === 'missions') renderMissions();
          if (sub === 'catalog') renderCatalog();
          if (sub === 'achievements') renderAchievements();
        });
      });

      document.getElementById('pauseButton').addEventListener('click', () => {
        if (state === 'playing') {
          state = 'paused';
          pauseModal.classList.remove('hidden');
        }
      });

      document.getElementById('resumeBtn').addEventListener('click', () => {
        if (state === 'paused') {
          state = 'playing';
          pauseModal.classList.add('hidden');
        }
      });

      document.getElementById('quitBtn').addEventListener('click', () => {
        pauseModal.classList.add('hidden');
        returnToMenu();
      });

      document.getElementById('retryBtn').addEventListener('click', () => {
        deathModal.classList.add('hidden');
        startGame();
      });

      document.getElementById('deathQuitBtn').addEventListener('click', () => {
        deathModal.classList.add('hidden');
        returnToMenu();
      });

      document.getElementById('settingsButton').addEventListener('click', () => {
        settingsPanel.classList.toggle('hidden');
      });

      document.getElementById('audioToggle').addEventListener('click', () => {
        const toggler = document.getElementById('audioToggle');
        audioEnabled = !audioEnabled;
        save.audio = audioEnabled;
        toggler.classList.toggle('on', audioEnabled);
        localStorage.setItem('neonVanguardSave', JSON.stringify(save));
      });

      document.getElementById('fullscreenButton').addEventListener('click', async () => {
        try {
          if (!document.fullscreenElement) {
            await document.documentElement.requestFullscreen();
          } else {
            await document.exitFullscreen();
          }
        } catch (error) {}
      });

      canvas.addEventListener('pointermove', (event) => {
        const rect = canvas.getBoundingClientRect();
        input.mouseX = (event.clientX - rect.left) / rect.width * canvas.width;
        input.mouseY = (event.clientY - rect.top) / rect.height * canvas.height;
      });

      canvas.addEventListener('pointerdown', (event) => {
        canvas.setPointerCapture(event.pointerId);
        input.pointerDown = true;
        input.shootHeld = true;
      });

      canvas.addEventListener('pointerup', () => {
        input.pointerDown = false;
        input.shootHeld = false;
      });

      canvas.addEventListener('pointerleave', () => {
        input.pointerDown = false;
        input.shootHeld = false;
      });

      window.addEventListener('keydown', (event) => {
        const key = event.key.toLowerCase();
        input.keys.add(key);
        if (key === ' ') { input.shootHeld = true; event.preventDefault(); }
        if (event.key === 'Escape' && state === 'playing') {
          state = 'paused';
          pauseModal.classList.remove('hidden');
        }
        if (key === 'shift') dash();
      });

      window.addEventListener('keyup', (event) => {
        const key = event.key.toLowerCase();
        input.keys.delete(key);
        if (key === ' ') input.shootHeld = false;
      });

      document.addEventListener('click', (event) => {
        if (event.target === settingsPanel || event.target === document.getElementById('settingsButton')) return;
        if (!settingsPanel.contains(event.target) && !event.target.closest('#settingsButton')) {
          settingsPanel.classList.add('hidden');
        }
      });

      function applySavedVisuals() {
        loadSave();
        const currentShip = ships.find(item => item.id === save.selectedShip) || ships[0];
        save.shipColor = currentShip.color;
        player.color = save.shipColor;
        document.getElementById('audioToggle').classList.toggle('on', save.audio !== false);
        audioEnabled = save.audio !== false;
        renderShips();
        populateShop();
        renderMissions();
        renderCatalog();
        renderAchievements();
        updateHud();
      }

      document.addEventListener('visibilitychange', () => {
        if (document.hidden && state === 'playing') {
          state = 'paused';
          pauseModal.classList.remove('hidden');
        }
      });

      applySavedVisuals();
      updateHud();
      showTransition();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
